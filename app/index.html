<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LatinoTV v2.3.1-Cinecalidad</title>
  <link rel="stylesheet" href="css/style.css?v=6434d05">
  <script>
    /* Force reload if cached JS is older than expected */
    (function() {
      var EXPECTED = '2026-10-19-cinecalidad';
      try {
        var saved = sessionStorage.getItem('_ltv_ver');
        if (!saved || saved !== EXPECTED) {
          sessionStorage.setItem('_ltv_ver', EXPECTED);
          /* Clear all storage to remove old state */
          try { localStorage.removeItem('latinotv.state'); } catch(e){}
          try { localStorage.removeItem('latinotv.cachever'); } catch(e){}
          /* Force hard reload bypassing cache */
          location.href = location.pathname + '?t=' + Date.now();
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="player" class="player hidden" aria-hidden="true">
    <video id="video" playsinline></video>

    <div id="player-osd" class="player-osd">
      <div class="osd-top">
        <div class="osd-titles">
          <div id="player-title" class="player-title"></div>
          <div id="player-subtitle" class="player-subtitle"></div>
        </div>
        <div id="player-badge" class="player-badge hidden">EN VIVO</div>
      </div>

      <div class="osd-bottom">
        <div class="progress-wrap">
          <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
          <div class="times">
            <span id="time-current">00:00</span>
            <span id="time-total">00:00</span>
          </div>
        </div>
        <div class="osd-controls">
          <span class="control">&#9664;&#9664; 10s</span>
          <span id="ctrl-play" class="control control-main">&#9654;</span>
          <span class="control">10s &#9654;&#9654;</span>
          <span class="control hint">OK: play/pausa &nbsp;&middot;&nbsp; &#8592;/&#8594;: avanzar &nbsp;&middot;&nbsp; Verde: subt&iacute;tulos &nbsp;&middot;&nbsp; Atr&aacute;s: salir</span>
        </div>
      </div>
    </div>

    <div id="player-panel" class="player-panel hidden">
      <div class="panel-card">
        <div id="panel-title" class="panel-title"></div>
        <div id="panel-sub" class="panel-sub"></div>
        <div id="panel-list" class="panel-list"></div>
        <div class="panel-hint">OK: elegir &nbsp;&middot;&nbsp; Atr&aacute;s: cerrar</div>
      </div>
    </div>

    <div id="player-message" class="player-message hidden"></div>
    <div id="player-spinner" class="spinner player-spinner hidden"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="vendor/hls.min.js?v=6434d05"></script>
  <script src="vendor/pako.min.js?v=6434d05"></script>
  <script src="js/util.js?v=6434d05"></script>
  <script src="js/store.js?v=6434d05"></script>
  <script src="js/providers.js?v=6434d05"></script>
  <script src="js/providers/demo.js?v=6434d05"></script>
  <script src="js/providers/jellyfin.js?v=6434d05"></script>
  <script src="js/providers/m3u.js?v=6434d05"></script>
  <script src="js/providers/archive.js?v=6434d05"></script>
  <script src="js/repos.js?v=6434d05"></script>
  <script src="js/subtitles.js?v=6434d05"></script>
  <script src="js/spatial.js?v=6434d05"></script>
  <script src="js/player.js?v=6434d05"></script>
  <script src="js/app.js?v=6434d05"></script>
</body>
</html>
